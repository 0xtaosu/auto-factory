services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      INVENTORY_ADMIN_TOKEN: ${INVENTORY_ADMIN_TOKEN:-}
      INVENTORY_ALLOWED_ORIGINS: ${INVENTORY_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      INVENTORY_ALLOWED_HOSTS: ${INVENTORY_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      INVENTORY_COOKIE_SECURE: ${INVENTORY_COOKIE_SECURE:-false}
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  backend_data:
